<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>마스 시티: 수식 수배자들 (Math City Wanted)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05060c;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;touch-action:none}
canvas#game,canvas#g3d{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#g3d{display:none}
body.car canvas#g3d{display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:#fff}
.screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3cf,#7f7);border-radius:6px;transition:width .2s}
.bar.red i{background:linear-gradient(90deg,#f55,#f9a)}
.big{font-size:22px;font-weight:800;padding:16px 26px;border-radius:16px;background:linear-gradient(180deg,#ffcf3a,#ff8a00);color:#2a1300;box-shadow:0 6px 0 #a24f00,0 10px 20px rgba(0,0,0,.4)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a24f00}
.big.alt{background:linear-gradient(180deg,#45d4ff,#1677ff);color:#fff;box-shadow:0 6px 0 #0b3f99,0 10px 20px rgba(0,0,0,.4)}
.big:disabled{filter:grayscale(1) brightness(.7)}

/* edge & fever */
#edge{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0}
#edge.on{animation:edgeP 1s infinite}
#edge.siren{animation:siren .5s infinite}
@keyframes edgeP{0%,100%{opacity:0;box-shadow:inset 0 0 0 0 #f00}50%{opacity:1;box-shadow:inset 0 0 90px 25px rgba(255,0,0,.75)}}
@keyframes siren{0%,100%{opacity:1;box-shadow:inset 0 0 120px 40px rgba(255,0,40,.8)}50%{opacity:1;box-shadow:inset 0 0 120px 40px rgba(0,80,255,.8)}}
#fever{position:fixed;inset:0;pointer-events:none;z-index:6;display:none;border:10px solid;border-image:linear-gradient(45deg,#f0f,#0ff,#ff0,#f0f) 1;animation:hue 1s linear infinite}
#fever.on{display:block}
@keyframes hue{to{filter:hue-rotate(360deg)}}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud button{pointer-events:auto}
#hudTop{position:absolute;left:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 200px)}
.pill{background:rgba(8,10,20,.72);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:7px 12px;font-size:18px;font-weight:800;backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;text-shadow:0 2px 0 #000}
.pill.evi .bar{width:110px}
#hStars{letter-spacing:2px;font-size:20px}
#hStars .on{color:#ffd400;text-shadow:0 0 8px #ffb300}
#hStars .off{color:#555}
#hStars.flash{animation:sf .3s 4}
@keyframes sf{50%{transform:scale(1.3)}}
#hudInfo{position:absolute;left:12px;top:64px;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000;line-height:1.5}
#hZone.red{color:#ff4d6d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
#mini{position:absolute;right:10px;top:max(10px,env(safe-area-inset-top));width:170px;height:170px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:#111;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#bounty{position:absolute;right:10px;top:190px;width:170px;background:rgba(8,10,20,.72);border-radius:12px;padding:6px 8px;font-size:12px;line-height:1.55;border:1px solid rgba(255,255,255,.15)}
#bounty b{color:#ffd400}
#bounty .me{color:#7ff}
#hudBtns{position:absolute;right:10px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px}
.rb{width:76px;height:76px;border-radius:20px;background:rgba(10,14,30,.82);border:2px solid rgba(255,255,255,.25);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.rb small{font-size:12px;font-weight:700}
.rb.nitro{background:linear-gradient(180deg,#ff7b00,#b31200);width:96px}
#stageT{z-index:96;background:#000;flex-direction:column;opacity:0}
#stageT.go{animation:stg 2.6s ease-in-out forwards}
@keyframes stg{0%{opacity:0}20%,75%{opacity:1}100%{opacity:0}}
.stN{font-size:30px;font-weight:900;color:#00e5ff;letter-spacing:8px;text-shadow:0 0 20px #00e5ff}
.stName{font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 30px #ff2bd6;margin:10px 0}
.stD{font-size:22px;color:#ffd400}
.plane{font-size:90px;animation:fly 2.6s ease-in-out forwards}
@keyframes fly{0%{transform:translate(-60vw,30px) rotate(10deg)}50%{transform:translate(0,0) rotate(0)}100%{transform:translate(60vw,-40px) rotate(-10deg)}}
.rb:active{transform:scale(.93)}
#joyBase{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.18));border:2px solid rgba(255,255,255,.35);display:none;transform:translate(-50%,-50%)}
#joyKnob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9cf 40%,#36c);box-shadow:0 4px 12px rgba(0,0,0,.6)}
#toasts{position:absolute;left:50%;top:80px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:90%}
.toast{background:rgba(10,12,25,.88);border:2px solid #ffd400;border-radius:14px;padding:8px 16px;font-size:18px;font-weight:800;animation:tin .25s ease-out;text-align:center}
.toast.bad{border-color:#ff3b5c}
.toast.good{border-color:#3cff8a}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:44px;font-weight:900;letter-spacing:1px;text-shadow:0 0 18px #f0f,0 4px 0 #000;opacity:0;pointer-events:none}
#banner small{display:block;font-size:20px;text-shadow:0 2px 4px #000}
#banner.show{animation:ban 2.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}

/* title */
#title{z-index:80;background:#04050b}
#titleBg{position:absolute;inset:0;width:100%;height:100%}
.tbox{position:relative;text-align:center;padding:30px;background:rgba(5,6,16,.6);border-radius:26px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);max-width:92vw}
.neonT{font-size:64px;font-weight:900;line-height:.95;color:#fff;text-shadow:0 0 6px #fff,0 0 18px #ff2bd6,0 0 40px #ff2bd6,0 0 70px #ff2bd6;font-style:italic;animation:flick 3s infinite}
.neonT span{color:#fff;text-shadow:0 0 6px #fff,0 0 18px #00e5ff,0 0 40px #00e5ff,0 0 70px #00e5ff;font-size:84px}
@keyframes flick{0%,19%,21%,60%,62%,100%{opacity:1}20%,61%{opacity:.55}}
.sub{font-size:26px;font-weight:900;margin:14px 0 6px;color:#ffd400;text-shadow:0 3px 0 #7a3b00}
.unit{font-size:16px;opacity:.85;margin-bottom:16px}
#pname{font-size:20px;padding:12px 16px;border-radius:12px;border:2px solid #555;background:#111;color:#fff;width:300px;max-width:80vw;text-align:center;margin-bottom:16px;user-select:text;-webkit-user-select:text}
.tbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.link{background:none;color:#9cf;font-size:17px;margin-top:16px;text-decoration:underline}

/* modal */
#modal{background:rgba(0,0,0,.65);z-index:85}
#mbox{background:linear-gradient(180deg,#151a33,#0b0e1d);border:2px solid #3a4580;border-radius:22px;padding:22px;width:min(720px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:text}
#mbox h2{margin:0 0 12px;font-size:26px}
#mbox p,#mbox li{font-size:17px;line-height:1.6}
.mrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mbtn{flex:1;min-width:150px;font-size:18px;font-weight:800;padding:14px;border-radius:14px;background:#2b3770;border:2px solid #4a5bb0}
.mbtn.gold{background:linear-gradient(180deg,#ffcf3a,#ff8a00);color:#2a1300;border-color:#ffd977}
.mbtn.red{background:#7a1630;border-color:#d33}
.mbtn:disabled{opacity:.4}
.mbtn:active{transform:scale(.96)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.card{background:#1d2445;border-radius:14px;padding:10px;text-align:center;border:2px solid #333c6a;font-size:14px}
.card.sel{border-color:#ffd400;box-shadow:0 0 14px #ffd40088}
.card .st{color:#ffd400;font-size:15px}
.card canvas{width:100%;height:80px}
.r1{border-color:#8a8a8a}.r2{border-color:#3fd16b}.r3{border-color:#3aa0ff}.r4{border-color:#b34dff}.r5{border-color:#ffb300;box-shadow:0 0 16px #ffb30088}
.logItem{background:#1a2040;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;line-height:1.5}
.logItem b{color:#ff7a90}
.setRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2a3260;font-size:17px}
.setRow select{font-size:16px;padding:6px;border-radius:8px;background:#111;color:#fff;border:1px solid #555}

/* question */
#qm{background:rgba(0,0,0,.6);z-index:65}
#qbox{position:relative;width:min(860px,96vw);max-height:96vh;overflow:auto;background:linear-gradient(180deg,#f8fbff,#e9f0ff);color:#132;border-radius:24px;padding:16px 18px 18px;border:5px solid #1b2a66;box-shadow:0 0 0 4px #ffd400,0 20px 60px rgba(0,0,0,.6);user-select:none}
#qbox.red{border-color:#8a0020;box-shadow:0 0 0 4px #ff2b4d,0 0 50px #f0034a}
#qbox.boss{border-color:#3b0066;box-shadow:0 0 0 4px #c04dff,0 0 60px #a000ff}
#qbox.shake{animation:qsh .4s}
@keyframes qsh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
#qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
#qTitle{font-size:22px;font-weight:900;color:#1b2a66}
#qSrc{font-size:13px;background:#1b2a66;color:#fff;border-radius:8px;padding:3px 8px;white-space:nowrap}
#qTimer{position:relative;height:22px;background:#d3dcf0;border-radius:11px;overflow:hidden;margin-bottom:10px}
#qTimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2ecc71,#f1c40f);transition:width .1s linear}
#qTimer.low i{background:linear-gradient(90deg,#e74c3c,#ff7675)}
#qTimer.frozen i{background:linear-gradient(90deg,#74b9ff,#a29bfe)}
#qTimer span{position:absolute;inset:0;text-align:center;font-size:14px;font-weight:900;line-height:22px;color:#123}
#qDuel{background:#2a0b12;color:#fff;border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:15px}
#qBody{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
#qText{flex:1 1 300px;font-size:23px;font-weight:800;line-height:1.5;white-space:pre-line;word-break:keep-all}
#qFig{flex:0 1 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
#qFig img,#nFig img{background:#fff;border-radius:10px;border:2px solid #c9d4ee;max-width:min(400px,90vw);max-height:260px;image-rendering:auto;cursor:zoom-in}
.figc{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:18px;background:#fff;border:2px solid #c9d4ee;border-radius:10px;padding:4px}
.figc img{border:none!important;max-height:120px!important}
.figc svg{width:120px;height:100px}
#qAns{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#qAns.one{grid-template-columns:1fr}
.opt{font-size:20px;font-weight:800;padding:16px 12px;border-radius:16px;background:#fff;color:#123;border:3px solid #9fb2e6;box-shadow:0 5px 0 #7b8fc9;text-align:center;line-height:1.35;word-break:keep-all;min-height:62px}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7b8fc9}
.opt.on{background:#ffe066;border-color:#e6a800;box-shadow:0 5px 0 #b38300}
.opt.hack{background:#ddd;color:#999;text-decoration:line-through;border-color:#bbb;box-shadow:none}
.opt.ok{background:#2ecc71!important;color:#fff;border-color:#1e8449}
.opt.bad{background:#e74c3c!important;color:#fff;border-color:#922}
.opt:disabled{filter:grayscale(1);opacity:.55}
.submit{grid-column:1/-1;font-size:22px;font-weight:900;padding:16px;border-radius:16px;background:linear-gradient(180deg,#45d4ff,#1677ff);box-shadow:0 5px 0 #0b3f99}
.submit:disabled{filter:grayscale(1);opacity:.5}
.numWrap{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px}
.numFields{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.nf{display:flex;flex-direction:column;align-items:center;font-size:15px;font-weight:800;color:#345}
.nfBox{min-width:130px;height:62px;border-radius:14px;background:#fff;border:3px solid #9fb2e6;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#123}
.nf.act .nfBox{border-color:#ff8a00;box-shadow:0 0 0 3px #ffd40099}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.pad button{font-size:26px;font-weight:900;padding:12px 0;border-radius:14px;background:#1b2a66;box-shadow:0 4px 0 #0c1438}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1438}
.pad .del{background:#7a3b3b}
.ordSeq{grid-column:1/-1;text-align:center;font-size:22px;font-weight:900;min-height:34px;color:#1b2a66}
#qTools{display:flex;gap:10px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
#qTools button{font-size:15px;font-weight:800;padding:8px 12px;border-radius:12px;background:#1b2a66}
#qTools button:disabled{opacity:.35}
#qLock{position:absolute;inset:0;background:rgba(120,0,20,.55);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff;text-shadow:0 3px 0 #000;z-index:3}
#qLock small{font-size:20px}
#qWarn{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#111;color:#ffd400;border:4px solid #ffd400;border-radius:18px;padding:16px 22px;font-size:24px;font-weight:900;text-align:center;z-index:4;animation:tin .2s}
.okBurst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:900;color:#2ecc71;text-shadow:0 4px 0 #145a32,0 0 30px #fff;z-index:5;animation:okb .9s ease-out forwards;pointer-events:none}
@keyframes okb{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}

/* note */
#note{background:rgba(80,0,10,.75);z-index:70;animation:redflash .6s}
@keyframes redflash{0%{background:rgba(255,0,0,.9)}100%{background:rgba(80,0,10,.75)}}
#nbox{width:min(780px,95vw);max-height:94vh;overflow:auto;background:#fff8f0;color:#2a1010;border-radius:22px;border:6px solid #c0392b;padding:18px;box-shadow:0 20px 60px #000}
.nh{font-size:26px;font-weight:900;color:#c0392b;margin-bottom:10px}
#nQ{font-size:19px;font-weight:700;white-space:pre-line;margin-bottom:8px}
#nFig{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
#nFig img{max-height:230px}
#nAns{font-size:24px;font-weight:900;color:#0a7d33;background:#e6ffe9;border-radius:12px;padding:10px 14px;margin-bottom:8px}
#nAns .mine{display:block;font-size:16px;color:#c0392b;font-weight:700}
#nExp{font-size:19px;line-height:1.6;background:#fff;border:2px dashed #e0a0a0;border-radius:12px;padding:12px;margin-bottom:12px}
.bar.note{height:16px;background:#f3d6d6}
.bar.note i{background:linear-gradient(90deg,#c0392b,#ff7675);transition:width .1s linear}
#nNext{width:100%;margin-top:12px;font-size:22px;font-weight:900;padding:16px;border-radius:16px;background:#2c3e50}
#nNext:not(:disabled){background:linear-gradient(180deg,#45d4ff,#1677ff);box-shadow:0 5px 0 #0b3f99}

/* gacha */
#gacha{background:radial-gradient(circle,#1d0f3a,#05030c 70%);z-index:75;flex-direction:column}
#gBox,#gCard,#gMsg,#gOk{position:relative;z-index:2}
#gRays{pointer-events:none;z-index:0;position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;opacity:0;transition:opacity .4s}
#gRays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
#gBox{position:relative;width:200px;height:190px;cursor:pointer}
#gBox .body{position:absolute;bottom:0;left:0;right:0;height:140px;border-radius:12px;background:linear-gradient(135deg,#5b3cc4,#2b1677);border:4px solid #c9b4ff;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:900;color:#fff;text-shadow:0 0 20px #fff}
#gBox .lid{position:absolute;top:20px;left:-10px;right:-10px;height:46px;border-radius:10px;background:linear-gradient(135deg,#7b5cf4,#3b2697);border:4px solid #c9b4ff;z-index:2}
#gBox.s1{animation:gs .18s infinite}
#gBox.s2{animation:gs .09s infinite}
#gBox.s3{animation:gs .05s infinite}
@keyframes gs{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-6px,2px) rotate(-4deg)}75%{transform:translate(6px,-2px) rotate(4deg)}}
#gBox.burst{animation:gburst .5s forwards}
@keyframes gburst{to{transform:scale(2.4);opacity:0}}
#gBox.g3 .body,#gBox.g3 .lid{border-color:#5cf;box-shadow:0 0 40px #3af}
#gBox.g4 .body,#gBox.g4 .lid{border-color:#d7f;box-shadow:0 0 50px #b4f}
#gBox.g5 .body,#gBox.g5 .lid{border-color:#ffd400;box-shadow:0 0 70px #ffb300,0 0 120px #ff8a00}
#gCard{width:260px;min-height:330px;border-radius:20px;background:linear-gradient(160deg,#1b2147,#0c0f24);border:5px solid #888;text-align:center;padding:16px;animation:flip .7s ease-out;position:relative}
#gCard.r5{border-color:#ffd400;box-shadow:0 0 50px #ffb300;background:linear-gradient(160deg,#4a3500,#140c00)}
#gCard.r4{border-color:#b34dff;box-shadow:0 0 40px #b34dff}
#gCard.r3{border-color:#3aa0ff;box-shadow:0 0 30px #3aa0ff}
#gCard.r2{border-color:#3fd16b}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6)}100%{transform:rotateY(0) scale(1)}}
#gCard .gs{font-size:30px;color:#ffd400;letter-spacing:2px}
#gCard .gn{font-size:24px;font-weight:900;margin:8px 0}
#gCard .gd{font-size:15px;opacity:.9;line-height:1.5}
#gCard canvas{width:220px;height:140px}
#gMsg{margin:18px 0 10px;font-size:22px;font-weight:900;min-height:30px;text-align:center}

/* jail */
#jail{z-index:62;background:rgba(0,0,0,.55)}
#jail .bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 70px,#555 70px 84px,#999 84px 88px,#333 88px 96px);opacity:.9}
.jbox{position:relative;text-align:center;background:rgba(10,0,0,.85);border:4px solid #f33;border-radius:22px;padding:24px;font-size:18px;max-width:90vw}
.jt{font-size:42px;font-weight:900;color:#f44;animation:blink .6s infinite}
.jtime{font-size:80px;font-weight:900;margin:8px 0 14px}

/* ending */
#ending{z-index:90;background:#000;flex-direction:column}
#fw{position:absolute;inset:0;width:100%;height:100%}
#credits{position:absolute;left:0;right:0;top:100%;text-align:center;font-size:24px;line-height:2;font-weight:800;text-shadow:0 0 10px #f0f}
#credits.roll{animation:roll 26s linear forwards}
@keyframes roll{to{transform:translateY(calc(-100% - 100vh))}}
#credits h1{font-size:48px;color:#ffd400;text-shadow:0 0 20px #ff8a00;line-height:1.2}
#endBtn{position:absolute;bottom:30px}
#loading3d{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:20;background:rgba(5,8,20,.85);border:2px solid #00e5ff;border-radius:16px;padding:14px 22px;font-size:20px;font-weight:800;pointer-events:none}
#zoom{z-index:95;background:rgba(0,0,0,.85)}
#zoom img{max-width:94vw;max-height:90vh;background:#fff;border-radius:12px}
@media (max-width:700px){
  #qText{font-size:19px}.opt{font-size:17px}.neonT{font-size:44px}.neonT span{font-size:58px}
  #mini{width:120px;height:120px}#bounty{top:138px;width:120px;font-size:10px}
  .rb{width:62px;height:62px;font-size:24px}
  #hudTop{max-width:calc(100% - 140px)}
  .pill{font-size:15px;padding:5px 9px}.pill.evi .bar{width:60px}
}

</style>
</head>
<body>
<canvas id="g3d"></canvas>
<canvas id="game"></canvas>
<div id="edge"></div>
<div id="fever"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hudTop">
    <div class="pill" id="hCoins">💰 <b>0</b></div>
    <div class="pill evi"><span>🧾 증거</span><div class="bar"><i id="hEviBar"></i></div><b id="hEvi">0/100</b></div>
    <div class="pill" id="hStars"></div>
    <div class="pill" id="hStreak">🔥 0</div>
  </div>
  <div id="hudInfo"><div id="hZone"></div><div id="hCar"></div><div id="hClock"></div></div>
  <canvas id="mini" width="170" height="170"></canvas>
  <div id="bounty"></div>
  <div id="hudBtns">
    <button id="bView" class="rb">🎥<small id="hView">차량 시점</small></button>
    <button id="bNitro" class="rb nitro">🔥<small>니트로 <b id="hNitro">100%</b></small></button>
    <button id="bSmoke" class="rb">💨<small>연막탄 <b>0</b></small></button>
    <button id="bBag" class="rb">🎒<small>가방</small></button>
    <button id="bLog" class="rb">📒<small>수배기록</small></button>
    <button id="bSet" class="rb">⚙️<small>설정</small></button>
  </div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="toasts"></div>
  <div id="banner"></div>
</div>

<!-- 타이틀 -->
<div id="title" class="screen">
  <canvas id="titleBg"></canvas>
  <div class="tbox">
    <div class="neonT">MATH CITY<br><span>WANTED</span></div>
    <div class="sub">마스 시티 : 수식 수배자들</div>
    <div class="unit">4학년 2학기 · 4단원 <b>사각형</b> · 문제 <span id="qCount"></span>개 수록</div>
    <input id="pname" maxlength="8" placeholder="수배자 이름 (예: 번개 채영)">
    <div class="tbtns">
      <button id="btnNew" class="big">🚗 새 게임</button>
      <button id="btnCont" class="big alt">▶ 이어하기</button>
    </div>
    <button id="btnHow" class="link">❓ 게임 방법</button>
  </div>
</div>

<!-- 공용 모달 -->
<div id="modal" class="screen hidden"><div id="mbox"></div></div>
<!-- 문제 모달 -->
<div id="qm" class="screen hidden">
  <div id="qbox">
    <div id="qhead"><span id="qTitle"></span><span id="qSrc"></span></div>
    <div id="qTimer"><i></i><span></span></div>
    <div id="qDuel" class="hidden"><div>🤖 <b id="qRivalName"></b> 푸는 중…</div><div class="bar red"><i id="qRivalBar"></i></div></div>
    <div id="qBody">
      <div id="qText"></div>
      <div id="qFig"></div>
    </div>
    <div id="qAns"></div>
    <div id="qTools"></div>
    <div id="qLock" class="hidden"></div>
    <div id="qWarn" class="hidden"></div>
  </div>
</div>
<!-- 오답 노트 -->
<div id="note" class="screen hidden">
  <div id="nbox">
    <div class="nh">⚠️ 수배 기록 · 오답 노트</div>
    <div id="nQ"></div>
    <div id="nFig"></div>
    <div id="nAns"></div>
    <div id="nExp"></div>
    <div class="bar note"><i id="nBar"></i></div>
    <button id="nNext" disabled>15초 후에 넘어갈 수 있어요</button>
  </div>
</div>
<!-- 가챠 -->
<div id="gacha" class="screen hidden">
  <div id="gRays"></div>
  <div id="gBox"><div class="lid"></div><div class="body"><span>?</span></div></div>
  <div id="gCard" class="hidden"></div>
  <div id="gMsg"></div>
  <button id="gOk" class="big hidden">확인</button>
</div>
<!-- 감옥 -->
<div id="jail" class="screen hidden">
  <div class="bars"></div>
  <div class="jbox">
    <div class="jt">🚔 긴급 체포!</div>
    <div>30초 동안 이동 불가 · 지금 맞혀도 코인 없음 (노동형)</div>
    <div class="jtime" id="jTime">30</div>
    <button id="jWork" class="big">🧹 노동 문제 풀기 (증거만 획득)</button>
  </div>
</div>
<!-- 엔딩 -->
<div id="ending" class="screen hidden">
  <canvas id="fw"></canvas>
  <div id="credits"></div>
  <button id="endBtn" class="big hidden">🏙️ 자유 모드로 계속하기</button>
</div>
<div id="zoom" class="screen hidden"></div>
<div id="stageT" class="screen hidden"></div>
<div id="loading3d" class="hidden">🏗️ 3D 도시를 짓는 중… 잠시만요</div>

<script>
const SHAPES={trap:[[1,4],[5,4],[4,1.2],[2,1.2]],rtrap:[[1,4],[5,4],[3,1.2],[1,1.2]],rect:[[1,1.2],[5,1.2],[5,4],[1,4]],square:[[1.6,1],[4.4,1],[4.4,3.8],[1.6,3.8]],para:[[.8,4],[3.8,4],[5.2,1.2],[2.2,1.2]],para2:[[1.2,1.2],[4.2,1.2],[5,4],[2,4]],rhomb:[[3,.6],[5,2.5],[3,4.4],[1,2.5]],irr:[[1,4],[5,3.5],[4,1],[1.5,1.8]],tri:[[.8,4],[5.2,4],[3.6,1]],pent:(()=>{const m=[];for(let c=0;c<5;c++){const i=-Math.PI/2+2*c*Math.PI/5;m.push([3+1.75*Math.cos(i),2.6+1.75*Math.sin(i)])}return m})(),hex:(()=>{const m=[];for(let c=0;c<6;c++){const i=c*Math.PI/3;m.push([3+1.7*Math.cos(i),2.5+1.7*Math.sin(i)])}return m})()},QUESTIONS=[{id:"S1-1",src:"심화1 · 1번",lv:1,img:"S1_2",t:"num",q:"직선 가에 대한 수선은 모두 몇 개인가요?",unit:"개",a:2,exp:"직선 가와 만나서 이루는 각이 직각(90°)인 직선을 찾으면 직선 다, 직선 바로 2개입니다."},{id:"S1-2",src:"심화1 · 2번",lv:2,img:"S1_3",t:"multi",q:"도형에서 변 ㄱㄴ에 대한 수선을 모두 고르세요.",o:["변 ㄴㄷ","변 ㄷㄹ","변 ㄹㅁ","변 ㅁㅂ","변 ㄱㅂ"],a:[0,4],exp:"변 ㄱㄴ에 대한 수선은 변 ㄱㄴ과 수직으로 만나는 변인 변 ㄱㅂ과 변 ㄴㄷ입니다."},{id:"S1-3",src:"심화1 · 3번",lv:3,img:"S1_4",t:"num",q:"선분 ㄴㅁ에 대한 수선은 선분 ㅁㄷ입니다. ㉠은 몇 도인가요?",unit:"°",a:25,exp:"선분 ㄴㅁ과 선분 ㅁㄷ은 수직이므로 각 ㄴㅁㄷ은 90°입니다. 한 직선이 이루는 각은 180°이므로 ㉠ = 180° − 65° − 90° = 25°입니다."},{id:"S1-4",src:"심화1 · 4번",lv:2,img:"S1_5",t:"mc",q:"서로 평행한 변이 없는 도형을 바르게 짝지은 것은 어느 것인가요?",o:["가, 나","나, 다, 라","다, 라","다, 마, 바","가, 바"],a:4,exp:"아무리 길게 늘여도 서로 만나지 않는 변(평행한 변)이 없는 도형은 가, 바입니다."},{id:"S1-5",src:"심화1 · 5번",lv:2,img:"S1_5",t:"mc",q:"서로 수직인 변과 평행한 변이 모두 있는 도형을 바르게 짝지은 것은 어느 것인가요?",o:["가, 나, 라","나, 다, 마","가, 라","다, 라","나, 라, 마"],a:4,exp:"수직인 변이 있는 도형은 가, 나, 라, 마이고, 평행한 변이 있는 도형은 나, 다, 라, 마입니다. 둘 다 있는 도형은 나, 라, 마입니다."},{id:"S1-6",src:"심화1 · 6번(변형)",lv:2,t:"mc",q:"평행선 사이의 거리가 2.5 cm가 되도록 주어진 직선과 평행한 직선을 그으려고 합니다. 바른 방법은 어느 것인가요?",o:["주어진 직선에 수선을 긋고, 그 수선 위 2.5 cm인 곳에 점을 찍어 그 점을 지나는 평행선을 긋는다","주어진 직선 위의 한 점에서 비스듬하게 2.5 cm를 재어 점을 찍고 직선을 긋는다","주어진 직선에서 2.5 cm 떨어진 곳에 아무 방향으로나 직선을 긋는다","주어진 직선과 만나는 직선을 2.5 cm 길이로 긋는다"],a:0,exp:"주어진 직선에 수선을 그어서 그 길이가 2.5 cm가 되는 곳에 점을 찍고, 그 점을 지나는 평행선을 긋습니다."},{id:"S1-7",src:"심화1 · 7번",lv:2,img:"S1_6",t:"mc",q:"평행선 사이의 거리를 잘못 잰 것입니다. 그 이유로 알맞은 것은?",o:["평행선 사이의 수직인 선분의 길이를 재어야 하는데, 수직이 아닌 선분을 재었기 때문","자의 눈금을 0이 아닌 곳에서 시작했기 때문","두 직선이 평행하지 않기 때문","길이의 단위를 mm로 써야 하기 때문"],a:0,exp:"평행선 사이의 거리는 평행선 사이에 그은 수직인 선분의 길이를 재어야 합니다."},{id:"S1-8",src:"심화1 · 8번",lv:1,img:"S1_7",t:"num",q:"도형에서 평행선 사이의 거리는 몇 cm인가요?",unit:"cm",a:8,exp:"평행선(위쪽 변과 아래쪽 변) 사이의 수직인 선분의 길이는 8 cm입니다."},{id:"S1-9",src:"심화1 · 9번(그림 재구성)",lv:1,fig:[["가","trap"],["나","para"],["다","irr"]],t:"mc",q:"사다리꼴이 아닌 것은 어느 것인가요?",o:["가","나","다"],a:2,exp:"사다리꼴은 평행한 변이 한 쌍이라도 있는 사각형입니다. 다는 평행한 변이 없으므로 사다리꼴이 아닙니다."},{id:"S1-10",src:"심화1 · 10번",lv:2,img:"S1_8",t:"mc",q:"직사각형 모양의 종이를 그림과 같이 접어 잘랐을 때 만들어지는 사각형의 이름은?",o:["사다리꼴","마름모","정사각형","직사각형"],a:0,exp:"잘라서 펼친 사각형은 위쪽 변과 아래쪽 변이 평행한 사각형이므로 사다리꼴입니다."},{id:"S1-11",src:"심화1 · 11번",lv:3,img:"S1_9",t:"mc",q:"사다리꼴에서 ㉠은 몇 도인가요?",o:["75°","80°","105°","110°","115°"],a:2,exp:"사각형의 네 각의 합은 360°입니다. ㉠ = 360° − 75° − 90° − 90° = 105°"},{id:"S1-12",src:"심화1 · 12번(그림 재구성)",lv:1,fig:[["①","para"],["②","trap"],["③","para2"],["④","irr"],["⑤","rtrap"]],t:"multi",q:"평행사변형을 모두 고르세요.",o:["①","②","③","④","⑤"],a:[0,2],exp:"마주 보는 두 쌍의 변이 서로 평행한 사각형은 ①, ③입니다."},{id:"S1-14",src:"심화1 · 14번",lv:2,img:"S1_C",t:"mc",q:"평행사변형의 네 변의 길이의 합은 몇 cm인가요?",o:["22 cm","24 cm","28 cm","32 cm","44 cm"],a:4,exp:"평행사변형은 마주 보는 두 변의 길이가 같으므로 12 + 10 + 12 + 10 = 44(cm)입니다."},{id:"S1-15",src:"심화1 · 15번",lv:1,img:"S1_D",t:"multi",q:"마름모를 모두 찾아 고르세요.",o:["가","나","다","라"],a:[2,3],exp:"마름모는 네 변의 길이가 모두 같은 사각형이므로 다, 라입니다."},{id:"S1-16",src:"심화1 · 16번",lv:2,t:"mc",q:"네 변의 길이의 합이 52 cm인 마름모가 있습니다. 이 마름모의 한 변의 길이는 몇 cm인가요?",o:["11 cm","12 cm","13 cm","14 cm","16 cm"],a:2,exp:"마름모는 네 변의 길이가 모두 같으므로 한 변은 52 ÷ 4 = 13(cm)입니다."},{id:"S1-17",src:"심화1 · 17번",lv:3,img:"S1_E",t:"num",q:"사각형 ㄱㄴㄷㅁ은 마름모이고, 삼각형 ㅁㄷㄹ은 이등변삼각형입니다. 사각형 ㄱㄴㄷㄹ의 네 변의 길이의 합은 몇 cm인가요?",unit:"cm",a:61,exp:"삼각형 ㅁㄷㄹ은 이등변삼각형이므로 변 ㅁㄷ은 11 cm입니다. 마름모 ㄱㄴㄷㅁ의 네 변은 모두 11 cm이므로 네 변의 합은 11 + 11 + 17 + 11 + 11 = 61(cm)입니다."},{id:"S1-18",src:"심화1 · 18번",lv:1,img:"S1_F",t:"nums",q:"직사각형을 보고 □ 안에 알맞은 수를 써넣으세요.",labels:["안쪽 각 □°","오른쪽 변 □ cm","아래쪽 변 □ cm"],a:[90,9,13],exp:"직사각형은 네 각이 모두 직각(90°)이고, 마주 보는 두 변의 길이가 같습니다. 오른쪽 변 = 9 cm, 아래쪽 변 = 13 cm"},{id:"S1-19",src:"심화1 · 19번",lv:3,img:"S1_10",t:"mc",q:"이 사각형은 정사각형이 맞을까요? 알맞은 답과 이유를 고르세요.",o:["아닙니다 — 네 변의 길이가 같지 않기 때문","맞습니다 — 네 각이 모두 직각이기 때문","맞습니다 — 마주 보는 변이 서로 평행하기 때문","아닙니다 — 평행한 변이 없기 때문"],a:0,exp:"정사각형은 네 각이 모두 직각이고 네 변의 길이가 모두 같아야 합니다. 이 사각형은 네 변의 길이가 같지 않으므로 정사각형이 아닙니다."},{id:"S1-20",src:"심화1 · 20번",lv:3,t:"mc",q:"<조건>을 모두 만족하는 사각형의 이름은?\n· 네 변의 길이가 모두 같습니다.\n· 직사각형이 아닙니다.",o:["마름모","정사각형","직사각형","사다리꼴","평행사변형"],a:0,exp:"네 변의 길이가 모두 같은 사각형은 마름모, 정사각형입니다. 정사각형은 직사각형이라고도 할 수 있으므로 답은 마름모입니다."},{id:"S2-1",src:"심화2 · 1번",lv:1,img:"S2_4",t:"mc",q:"직선 가에 대한 수선은 어느 것인가요?",o:["직선 나","직선 다","직선 라"],a:1,exp:"직선 가와 만나서 이루는 각이 직각인 직선은 직선 다입니다."},{id:"S2-2",src:"심화2 · 2번",lv:1,img:"S2_5",t:"mc",q:"도형에서 변 ㄴㅂ에 수직인 선분은 어느 것인가요?",o:["변 ㄱㄴ","변 ㄱㄷ","변 ㄱㄹ","변 ㄱㅁ","변 ㄱㅂ"],a:1,exp:"변 ㄴㅂ과 만나서 직각을 이루는 선분은 변 ㄱㄷ입니다."},{id:"S2-3",src:"심화2 · 3번",lv:3,img:"S2_6",t:"num",q:"직선 ㄱㄴ과 직선 ㅁㅂ은 서로 수직이고, 직선 ㄷㄹ과 직선 ㅅㅈ은 서로 수직입니다. ㉠은 몇 도인가요?",unit:"°",a:30,exp:"직선 ㄱㄴ과 ㅁㅂ이 이루는 각이 직각이므로 (각 ㄱㅇㅈ) = 90° − 30° = 60°. 직선 ㄷㄹ과 ㅅㅈ이 이루는 각도 직각이므로 ㉠ = 90° − 60° = 30°입니다."},{id:"S2-4",src:"심화2 · 4번",lv:1,img:"S2_7",t:"mc",q:"직선 가와 평행한 직선은 어느 것인가요?",o:["직선 나","직선 다","직선 라","직선 마"],a:1,exp:"직선 가와 아무리 늘여도 만나지 않는 직선은 직선 다입니다."},{id:"S2-6",src:"심화2 · 6번(그림 재구성)",lv:2,fig:[["①","trap"],["②","para"],["③","rect"],["④","irr"],["⑤","hex"]],t:"mc",q:"평행선이 가장 많은 도형은 어느 것인가요?",o:["①","②","③","④","⑤"],a:4,exp:"평행선의 수: ① 1쌍 ② 2쌍 ③ 2쌍 ④ 없음 ⑤ 3쌍. 가장 많은 도형은 ⑤입니다."},{id:"S2-7",src:"심화2 · 7번",lv:1,img:"S2_8",t:"mc",q:"평행선 사이의 거리는 몇 cm인가요?",o:["4 cm","5 cm","6 cm","7 cm","8 cm"],a:0,exp:"평행선 사이의 거리는 평행선 사이의 수직인 선분의 길이이므로 4 cm입니다."},{id:"S2-9",src:"심화2 · 9번",lv:3,img:"S2_A",t:"mc",q:"변 ㄱㄴ과 변 ㄹㄷ은 서로 평행합니다. 변 ㄱㄴ과 변 ㄹㄷ 사이의 거리는 몇 cm인가요?",o:["12 cm","14 cm","16 cm","19 cm","21 cm"],a:3,exp:"두 변 사이의 수직인 선분의 길이를 모두 더합니다. 6 + 8 + 5 = 19(cm)"},{id:"S2-11",src:"심화2 · 11번",lv:2,img:"S2_C",t:"mc",q:"이 사각형은 사다리꼴이 맞을까요? 알맞은 답과 이유를 고르세요.",o:["맞습니다 — 평행한 변이 있기 때문","아닙니다 — 네 각이 모두 직각이기 때문","아닙니다 — 평행한 변이 두 쌍이기 때문","맞습니다 — 네 변의 길이가 모두 같기 때문"],a:0,exp:"사다리꼴은 평행한 변이 한 쌍이라도 있는 사각형입니다. 이 사각형은 평행한 변이 있으므로 사다리꼴입니다."},{id:"S2-12",src:"심화2 · 12번",lv:2,img:"S2_D",t:"mc",q:"사각형 ㄱㄴㄷㄹ에 대한 설명으로 틀린 것은?",o:["변 ㄱㄴ과 변 ㄹㄷ은 서로 평행합니다.","사각형 ㄱㄴㄷㄹ은 사다리꼴입니다.","사각형 ㄱㄴㄷㄹ은 평행사변형입니다.","변 ㄱㄹ과 변 ㄴㄷ은 서로 평행합니다.","변 ㄱㄴ과 변 ㄴㄷ은 수직으로 만납니다."],a:4,exp:"평행사변형 ㄱㄴㄷㄹ에서 변 ㄱㄴ과 변 ㄴㄷ은 직각으로 만나지 않습니다."},{id:"S2-13",src:"심화2 · 13번",lv:3,img:"S2_E",t:"mc",q:"평행사변형의 네 변의 길이의 합은 36 cm입니다. 변 ㄱㄹ의 길이는 몇 cm인가요?",o:["8 cm","9 cm","10 cm","11 cm","12 cm"],a:2,exp:"변 ㄱㄹ을 □ cm라고 하면 □ + 8 + □ + 8 = 36, □ + □ = 20, □ = 10(cm)입니다."},{id:"S2-14",src:"심화2 · 14번",lv:3,img:"S2_F",t:"num",q:"사각형 ㄱㄴㄷㄹ은 평행사변형입니다. 각 ㄴㄷㄹ의 크기는 몇 도인가요?",unit:"°",a:110,exp:"각 ㄴㄱㄹ = 180° − 35° − 35° = 110°. 평행사변형에서 마주 보는 각의 크기는 같으므로 각 ㄴㄷㄹ = 110°입니다."},{id:"S2-15",src:"심화2 · 15번(그림 재구성)",lv:1,fig:[["가","rhomb"],["나","square"],["다","para"]],t:"mc",q:"마름모가 아닌 것은 어느 것인가요?",o:["가","나","다"],a:2,exp:"마름모는 네 변의 길이가 모두 같은 사각형입니다. 다는 네 변의 길이가 모두 같지 않습니다."},{id:"S2-16",src:"심화2 · 16번",lv:2,img:"S2_10",t:"mc",q:"마름모에 대한 설명으로 틀린 것은?",o:["네 변의 길이가 모두 같습니다.","이웃한 두 변은 항상 수직으로 만납니다.","마주 보는 두 각의 크기가 같습니다."],a:1,exp:"마름모는 네 변의 길이가 같고, 마주 보는 두 각의 크기가 같습니다. 이웃한 두 변이 항상 수직인 것은 아닙니다."},{id:"S2-18",src:"심화2 · 18번",lv:1,img:"S2_12",t:"num",q:"마름모에서 ㉠은 몇 도인가요?",unit:"°",a:90,exp:"마름모에서 마주 보는 꼭짓점끼리 이은 두 선분은 수직으로 만나므로 ㉠은 90°입니다."},{id:"S2-19",src:"심화2 · 19번",lv:2,t:"mc",q:"사각형에 대한 설명 중 틀린 것은?",o:["평행사변형은 마주 보는 각의 크기가 같습니다.","평행사변형은 마주 보는 변의 길이가 같습니다.","정사각형은 네 각의 크기가 같습니다.","직사각형은 네 변의 길이가 같습니다.","마름모는 마주 보는 꼭짓점끼리 이은 두 선분이 수직으로 만납니다."],a:3,exp:"직사각형은 마주 보는 변의 길이가 같습니다. 네 변의 길이가 모두 같은 것은 아닙니다."},{id:"S2-20",src:"심화2 · 20번",lv:3,img:"S2_1",t:"multi",q:"크기가 다른 직사각형 모양 종이띠 2장을 겹쳤습니다. 겹쳐진 부분의 이름이 될 수 있는 것을 모두 고르세요.",o:["사다리꼴","평행사변형","마름모","직사각형","정사각형"],a:[0,1],exp:"겹쳐진 부분은 마주 보는 두 쌍의 변이 평행한 사각형이므로 사다리꼴, 평행사변형이라고 할 수 있습니다. (종이띠 폭이 달라서 네 변이 같지 않음)"},{id:"S3-1",src:"심화3 · 1번",lv:2,img:"S3_2",t:"order",q:"서로 수직인 변이 많은 도형부터 차례로 누르세요.",o:["가","나","다"],a:["가","나","다"],exp:"수직인 변: 가(직사각형)는 4군데, 나(직각삼각형)는 1군데, 다(원)는 없습니다. 따라서 가 → 나 → 다"},{id:"S3-2",src:"심화3 · 2번",lv:3,img:"S3_3",t:"mc",q:"직선 나는 직선 다에 대한 수선입니다. ㉠은 몇 도인가요?",o:["30°","35°","40°","45°","50°"],a:4,exp:"직선 나와 다가 만나서 이루는 각은 직각입니다. ㉠ = 180° − 40° − 90° = 50°"},{id:"S3-3",src:"심화3 · 3번",lv:2,img:"S3_4",t:"mc",q:"세 도형에서 서로 평행한 변은 모두 몇 쌍인가요?",o:["6쌍","7쌍","8쌍","9쌍","10쌍"],a:2,exp:"팔각형 4쌍, 육각형 3쌍, 사다리꼴 1쌍 → 4 + 3 + 1 = 8(쌍)"},{id:"S3-4",src:"심화3 · 4번",lv:3,img:"S3_5",t:"num",q:"변 ㄱㄴ과 변 ㄹㄷ은 서로 평행합니다. 변 ㄱㄴ과 변 ㄹㄷ 사이의 거리는 몇 cm인가요?",unit:"cm",a:13,exp:"두 변과 수직인 선분의 길이를 더합니다. 4 + 5 + 4 = 13(cm)"},{id:"S3-5a",src:"심화3 · 5번 (1)",lv:1,img:"S3_6",t:"mc",q:"사다리꼴에서 서로 평행한 변은 어느 것인가요?",o:["위쪽 변과 아래쪽 변","왼쪽 변과 오른쪽 변","위쪽 변과 왼쪽 변","오른쪽 변과 아래쪽 변"],a:0,exp:"아무리 늘여도 만나지 않는 두 변은 위쪽 변과 아래쪽 변입니다."},{id:"S3-5b",src:"심화3 · 5번 (2)",lv:1,img:"S3_7",t:"mc",q:"사다리꼴에서 서로 평행한 변은 어느 것인가요?",o:["왼쪽 변과 오른쪽 변","위쪽 변과 아래쪽 변","위쪽 변과 오른쪽 변","왼쪽 변과 아래쪽 변"],a:0,exp:"이 사다리꼴은 세로로 놓인 왼쪽 변과 오른쪽 변이 평행합니다."},{id:"S3-6",src:"심화3 · 6번",lv:2,t:"mc",q:"바르게 말한 사람은 누구인가요?\n서희: 평행사변형은 마주 보는 두 변의 길이가 같아.\n준호: 평행사변형은 마주 보는 꼭짓점끼리 이은 두 선분이 수직으로 만나.",o:["서희","준호","둘 다 맞음","둘 다 틀림"],a:0,exp:"마주 보는 꼭짓점끼리 이은 두 선분이 수직으로 만나는 것은 마름모와 정사각형입니다. 바르게 말한 사람은 서희입니다."},{id:"S3-7",src:"심화3 · 7번",lv:1,img:"S3_8",t:"nums",q:"평행사변형을 보고 □ 안에 알맞은 수를 써넣으세요.",labels:["위쪽 오른쪽 각 □°","오른쪽 변 □ cm"],a:[65,8],exp:"평행사변형에서 이웃한 두 각의 합은 180°이므로 180° − 115° = 65°. 마주 보는 변의 길이는 같으므로 8 cm입니다."},{id:"S3-8",src:"심화3 · 8번",lv:2,t:"mc",q:"길이가 64 cm인 끈을 남김없이 사용하여 마름모를 한 개 만들었습니다. 마름모의 한 변의 길이는?",o:["12 cm","14 cm","16 cm","17 cm","18 cm"],a:2,exp:"마름모는 네 변의 길이가 같으므로 64 ÷ 4 = 16(cm)입니다."},{id:"S3-9",src:"심화3 · 9번",lv:3,img:"S3_9",t:"mc",q:"그림에서 찾을 수 있는 크고 작은 마름모는 모두 몇 개인가요?",o:["2개","3개","4개","5개","6개"],a:3,exp:"작은 마름모 4개 + 큰 마름모 1개 = 5(개)"},{id:"S3-10",src:"심화3 · 10번",lv:3,img:"S3_A",t:"num",q:"직사각형 모양의 종이를 접어서 자른 후 펼쳤을 때 만들어지는 사각형의 네 변의 길이의 합은 몇 cm인가요?",unit:"cm",a:32,exp:"접어서 자른 사각형은 한 변이 8 cm인 정사각형입니다. 8 + 8 + 8 + 8 = 32(cm)"},{id:"S4-1",src:"심화4 · 1번",lv:2,img:"S4_2",t:"num",q:"직선 가와 수직인 직선은 모두 몇 개인가요?",unit:"개",a:2,exp:"직선 가와 직각으로 만나는 직선은 직선 다, 직선 마로 2개입니다."},{id:"S4-2",src:"심화4 · 2번",lv:1,img:"S4_3",t:"mc",q:"삼각자를 사용하여 평행선을 바르게 그은 것은 어느 것인가요?",o:["왼쪽","가운데","오른쪽"],a:2,exp:"한 삼각자를 고정하고 다른 삼각자를 대고 미끄러지듯 옮겨서 그은 오른쪽 그림이 평행선을 바르게 그은 것입니다."},{id:"S4-3",src:"심화4 · 3번",lv:2,img:"S4_C",t:"num",q:"도형에서 변 ㅁㅂ과 평행한 변은 모두 몇 개인가요?",unit:"개",a:3,exp:"변 ㅁㅂ과 평행한 변은 변 ㄷㄹ, 변 ㄱㄴ, 변 ㅇㅅ으로 3개입니다."},{id:"S4-4",src:"심화4 · 4번",lv:3,img:"S4_4",t:"num",q:"변 ㄱㄴ과 변 ㅂㅁ은 서로 평행합니다. 변 ㄱㄴ과 변 ㅂㅁ 사이의 거리는 몇 cm인가요?",unit:"cm",a:13,exp:"두 변 사이의 수직인 변의 길이를 더합니다. 6 + 7 = 13(cm)"},{id:"S4-5",src:"심화4 · 5번",lv:1,imgs:[["가","S4_5"],["나","S4_6"],["다","S4_7"]],t:"mc",q:"사다리꼴이 아닌 것은 어느 것인가요?",o:["가","나","다"],a:1,exp:"나는 평행한 변이 한 쌍도 없으므로 사다리꼴이 아닙니다."},{id:"S4-6",src:"심화4 · 6번",lv:2,t:"num",q:"민정이는 철사를 겹치지 않게 사용하여 긴 변이 11 cm, 짧은 변이 9 cm인 평행사변형을 만들었습니다. 사용한 철사는 몇 cm인가요?",unit:"cm",a:40,exp:"평행사변형은 마주 보는 두 변의 길이가 같으므로 11 + 9 + 11 + 9 = 40(cm)입니다."},{id:"S4-7",src:"심화4 · 7번",lv:3,img:"S4_8",t:"mc",q:"사각형 ㄱㄴㄷㄹ은 평행사변형입니다. ㉠은 몇 도인가요?",o:["25°","30°","35°","40°","50°"],a:0,exp:"평행사변형에서 이웃한 두 각의 합은 180°입니다. 70° + ㉠ + 85° = 180°, ㉠ = 25°"},{id:"S4-8",src:"심화4 · 8번",lv:3,img:"S4_9",t:"mc",q:"철사로 그림과 같은 정삼각형을 만들었습니다. 같은 철사로 마름모를 만들면 마름모의 한 변의 길이는 몇 cm인가요?",o:["5 cm","6 cm","7 cm","8 cm","9 cm"],a:1,exp:"철사 길이는 8 + 8 + 8 = 24(cm). 마름모 한 변은 24 ÷ 4 = 6(cm)입니다."},{id:"S4-9",src:"심화4 · 9번",lv:3,img:"S4_A",t:"mc",q:"크기가 같은 정삼각형을 이어 붙여 만든 도형에서 찾을 수 있는 마름모는 모두 몇 개인가요?",o:["3개","4개","5개","6개","7개"],a:0,exp:"가운데 정삼각형과 바깥 정삼각형 하나씩을 붙여 만든 마름모가 3개 있습니다."},{id:"S4-10",src:"심화4 · 10번",lv:3,img:"S4_B",t:"num",q:"정사각형 ㄱㄴㄷㄹ과 직사각형 ㄹㄷㅁㅂ을 이어 붙여 직사각형 ㄱㄴㅁㅂ을 만들었습니다. 직사각형 ㄱㄴㅁㅂ의 네 변의 길이의 합은 몇 cm인가요?",unit:"cm",a:34,exp:"변 ㄱㄹ = 12 − 7 = 5(cm), 정사각형이므로 변 ㄱㄴ = 5 cm. 네 변의 합 = 12 + 5 + 12 + 5 = 34(cm)"},{id:"B4-1",src:"기본4 · 1번(그림 재구성)",lv:1,fig:[["①","tri"],["②","para"],["③","rtrap"],["④","pent"],["⑤","rect"]],t:"multi",q:"서로 수직인 변이 있는 도형을 모두 고르세요.",o:["①","②","③","④","⑤"],a:[2,4],exp:"두 변이 만나서 직각을 이루는 도형은 ③(직각이 있는 사다리꼴), ⑤(직사각형)입니다."},{id:"B4-2a",src:"기본4 · 2번",lv:1,img:"B4_4",t:"mc",q:"직선 가에 수직인 직선은 어느 것인가요?",o:["직선 나","직선 다","직선 라"],a:2,exp:"직선 가와 직각으로 만나는 직선은 직선 라입니다."},{id:"B4-2b",src:"기본4 · 2번",lv:1,img:"B4_4",t:"mc",q:"직선 나에 대한 수선은 어느 것인가요?",o:["직선 가","직선 다","직선 라"],a:1,exp:"직선 나와 직각으로 만나는 직선은 직선 다입니다."},{id:"B4-4",src:"기본4 · 4번",lv:1,img:"B4_8",t:"num",q:"도형에서 서로 평행한 변은 모두 몇 쌍인가요?",unit:"쌍",a:2,exp:"평행사변형은 마주 보는 두 쌍의 변이 평행합니다. 2쌍"},{id:"B4-5",src:"기본4 · 5번",lv:2,t:"mc",q:"평행과 평행선에 대해 잘못 설명한 사람은?\n민아: 평행한 두 직선은 서로 만나지 않아.\n은서: 평행한 두 직선은 수직으로 만나.\n준호: 평행선은 한 직선에 수직인 두 직선이야.",o:["민아","은서","준호"],a:1,exp:"평행한 두 직선은 아무리 길게 늘여도 만나지 않습니다. 잘못 설명한 사람은 은서입니다."},{id:"B4-6",src:"기본4 · 6번",lv:2,img:"B4_2",t:"multi",q:"도형에서 변 ㅁㄹ과 평행한 선분을 모두 고르세요.",o:["변 ㄱㄴ","변 ㄴㄷ","변 ㄷㄹ","변 ㅅㅂ","변 ㅂㅁ"],a:[1,3],exp:"변 ㅁㄹ과 평행한 선분은 변 ㅅㅂ, 변 ㄴㄷ입니다."},{id:"B4-8",src:"기본4 · 8번",lv:2,img:"B4_1",t:"mc",q:"도형에서 변 ㄱㅂ과 변 ㄴㄷ 사이의 거리는 몇 cm인가요?",o:["7 cm","10 cm","12 cm","13 cm","15 cm"],a:3,exp:"두 변과 수직으로 만나는 변 ㅂㅁ과 변 ㄹㄷ의 길이를 더합니다. 7 + 6 = 13(cm)"},{id:"B4-10",src:"기본4 · 10번(그림 재구성)",lv:1,fig:[["①","trap"],["②","para"],["③","rtrap"],["④","irr"],["⑤","square"]],t:"mc",q:"사다리꼴이 아닌 것은 어느 것인가요?",o:["①","②","③","④","⑤"],a:3,exp:"사다리꼴은 평행한 변이 있는 사각형입니다. 평행한 변이 없는 ④는 사다리꼴이 아닙니다."},{id:"B4-11",src:"기본4 · 11번",lv:2,img:"B4_9",t:"mc",q:"색종이를 선을 따라 잘랐을 때, 잘라낸 도형 중에서 사다리꼴은 모두 몇 개인가요?",o:["2개","3개","4개","5개","6개"],a:1,exp:"잘라낸 도형 중 평행한 변이 있는 사각형(사다리꼴)은 3개입니다."},{id:"B4-12",src:"기본4 · 12번",lv:1,img:"B4_A",t:"nums",q:"평행사변형을 보고 □ 안에 알맞은 수를 써넣으세요.",labels:["왼쪽 □°","오른쪽 □°"],a:[115,65],exp:"평행사변형은 마주 보는 두 각의 크기가 같고(115°), 이웃한 두 각의 합은 180°입니다. 180° − 115° = 65°"},{id:"B4-14",src:"기본4 · 14번",lv:2,img:"B4_C",t:"mc",q:"평행사변형에서 ㉠과 ㉡에 알맞은 수의 합은 얼마인가요?",o:["11","12","13","14","15"],a:3,exp:"마주 보는 두 변의 길이가 같으므로 ㉠ = 5, ㉡ = 9. 합은 14입니다."},{id:"B4-15",src:"기본4 · 15번",lv:3,img:"B4_D",t:"num",q:"평행사변형 ㄱㄴㄷㄹ과 평행사변형 ㅁㅂㅅㅇ의 네 변의 길이의 합은 같습니다. 변 ㅂㅅ의 길이는 몇 cm인가요?",unit:"cm",a:11,exp:"ㄱㄴㄷㄹ의 둘레 = 8 + 9 + 8 + 9 = 34(cm). 변 ㅁㅇ을 □라 하면 □ + 6 + □ + 6 = 34, □ = 11. 변 ㅂㅅ = 11 cm"},{id:"B4-16",src:"기본4 · 16번",lv:1,img:"B4_E",t:"num",q:"이 사각형에서 길이가 같은 변은 모두 몇 개인가요?",unit:"개",a:4,exp:"네 변의 길이가 모두 같으므로 4개입니다."},{id:"B4-17",src:"기본4 · 17번",lv:1,img:"B4_E",t:"mc",q:"그림과 같이 네 변의 길이가 모두 같은 사각형을 무엇이라고 하나요?",o:["마름모","직사각형","사다리꼴","평행사변형"],a:0,exp:"네 변의 길이가 모두 같은 사각형은 마름모입니다."},{id:"B4-18",src:"기본4 · 18번",lv:3,img:"B4_F",t:"num",q:"정사각형과 마름모를 이어 붙여 만든 도형입니다. 굵은 선의 길이는 몇 cm인가요?",unit:"cm",a:48,exp:"정사각형과 마름모는 네 변의 길이가 모두 같습니다. 굵은 선은 8 cm가 6개이므로 8 × 6 = 48(cm)"},{id:"B4-19",src:"기본4 · 19번(재구성)",lv:2,t:"multi",q:"예준이는 길이가 5 cm인 막대 2개와 8 cm인 막대 2개를 가지고 있습니다. 이 막대 4개로 만들 수 없는 사각형을 모두 고르세요.",o:["사다리꼴","평행사변형","마름모","직사각형","정사각형"],a:[2,4],exp:"막대 길이가 모두 같지 않으므로 네 변의 길이가 같은 마름모와 정사각형은 만들 수 없습니다."},{id:"B4-20",src:"기본4 · 20번(재구성)",lv:2,fig:[["서진","rhomb"]],t:"multi",q:"서진이는 길이가 모두 같은 막대 4개로 그림과 같은 사각형(네 각이 직각이 아님)을 만들었습니다. 이 사각형의 이름이 될 수 없는 것을 모두 고르세요.",o:["사다리꼴","평행사변형","마름모","직사각형","정사각형"],a:[3,4],exp:"네 변의 길이는 모두 같지만 네 각이 직각이 아니므로 직사각형과 정사각형이 될 수 없습니다."},{id:"B5-1",src:"기본5 · 1번",lv:1,imgs:[["①","B5_3"],["②","B5_4"],["③","B5_5"],["④","B5_6"],["⑤","B5_7"]],t:"multi",q:"두 직선이 서로 수직으로 만나는 것을 모두 고르세요.",o:["①","②","③","④","⑤"],a:[0,4],exp:"두 직선이 만나서 이루는 각이 직각인 것은 ①, ⑤입니다."},{id:"B5-2a",src:"기본5 · 2번",lv:1,img:"B5_C",t:"mc",q:"직선 가에 수직인 두 직선은 어느 것인가요?",o:["직선 다, 직선 라","직선 나, 직선 다","직선 나, 직선 라"],a:0,exp:"직선 가와 직각으로 만나는 직선은 직선 다와 직선 라입니다."},{id:"B5-2b",src:"기본5 · 2번",lv:1,img:"B5_C",t:"mc",q:"직선 다와 직선 라는 서로 만나지 않으므로 평행하다고 합니다. 평행한 두 직선을 무엇이라고 하나요?",o:["평행선","수선","대각선","선분"],a:0,exp:"평행한 두 직선을 평행선이라고 합니다."},{id:"B5-4",src:"기본5 · 4번",lv:3,img:"B5_8",t:"num",q:"직선 가, 나, 다는 서로 평행합니다. 직선 가와 다 사이의 거리는 몇 cm인가요?",unit:"cm",a:9,exp:"직선 가와 다 사이의 수직인 선분의 길이의 합: 3 + 6 = 9(cm)"},{id:"B5-5",src:"기본5 · 5번",lv:2,img:"B5_9",t:"mc",q:"사각형 가~라를 보고 옳게 설명한 것을 고르세요.",o:["평행한 변이 없는 도형은 가입니다.","모두 평행한 변이 있습니다.","모두 수직인 변이 있습니다.","사다리꼴은 가, 다입니다.","사다리꼴은 가, 나, 라입니다."],a:4,exp:"평행한 변이 없는 도형은 다, 수직인 변이 없는 도형은 라입니다. 사다리꼴은 평행한 변이 있는 가, 나, 라입니다."},{id:"B5-6",src:"기본5 · 6번",lv:2,img:"B5_9",t:"mc",q:"평행사변형이 아닌 것은 어느 것인가요?",o:["가, 나","나, 다","다, 라","가, 다","나, 다, 라"],a:3,exp:"마주 보는 두 쌍의 변이 평행하지 않은 도형은 가, 다입니다."},{id:"B5-7",src:"기본5 · 7번",lv:1,img:"B5_A",t:"mc",q:"다음과 같이 네 변의 길이가 모두 같은 사각형을 무엇이라고 하나요?",o:["마름모","정사각형","직사각형","사다리꼴"],a:0,exp:"네 변의 길이가 모두 같은 사각형은 마름모입니다."},{id:"B5-8",src:"기본5 · 8번",lv:2,img:"B5_B",t:"mc",q:"모양과 크기가 같은 마름모 2개를 이어 붙여 평행사변형 ㄱㄴㄷㄹ을 만들었습니다. 네 변의 길이의 합은?",o:["28 cm","35 cm","42 cm","49 cm","56 cm"],a:2,exp:"네 변의 길이의 합은 마름모 한 변(7 cm)의 6배입니다. 7 × 6 = 42(cm)"},{id:"B5-9",src:"기본5 · 9번",lv:2,img:"B5_1",t:"num",q:"직사각형의 네 변의 길이의 합은 30 cm입니다. 변 ㄱㄹ의 길이는 몇 cm인가요?",unit:"cm",a:9,exp:"변 ㄱㄹ을 □라 하면 □ + 6 + □ + 6 = 30, □ + □ = 18, □ = 9(cm)"},{id:"B5-10",src:"기본5 · 10번",lv:2,t:"mc",q:"<조건>을 모두 만족하는 사각형은?\n· 마주 보는 두 쌍의 변이 서로 평행합니다.\n· 네 변의 길이가 모두 같습니다.\n· 네 각이 모두 같습니다.",o:["정사각형","마름모","직사각형","평행사변형"],a:0,exp:"네 변의 길이가 같고 네 각이 모두 같은(직각) 사각형은 정사각형입니다."},{id:"B6-1",src:"기본6 · 1번",lv:1,img:"B6_3",t:"multi",q:"사각형 ㄱㄴㄷㄹ에서 변 ㄴㄷ에 수직인 변을 모두 고르세요.",o:["변 ㄱㄴ","변 ㄱㄹ","변 ㄹㄷ"],a:[0,2],exp:"변 ㄴㄷ과 직각으로 만나는 변은 변 ㄱㄴ, 변 ㄹㄷ입니다."},{id:"B6-2",src:"기본6 · 2번",lv:2,img:"B6_4",t:"mc",q:"직선 나는 직선 가에 대한 수선입니다. ㉠은 몇 도인가요?",o:["35°","45°","55°","50°","90°"],a:0,exp:"두 직선이 만나서 이루는 각은 직각이므로 ㉠ = 90° − 55° = 35°"},{id:"B6-3",src:"기본6 · 3번(그림 재구성)",lv:2,fig:[["","para"]],t:"mc",q:"도형에서 찾을 수 있는 평행선은 모두 몇 쌍인가요?",o:["1쌍","2쌍","3쌍","4쌍","5쌍"],a:1,exp:"평행사변형은 마주 보는 두 쌍의 변이 평행하므로 2쌍입니다."},{id:"B6-4",src:"기본6 · 4번",lv:2,img:"B6_5",t:"num",q:"도형에서 평행선 사이의 거리는 몇 cm인가요?",unit:"cm",a:12,exp:"평행선은 변 ㄱㄴ과 변 ㄹㄷ입니다. 두 변과 수직인 변 ㄴㄷ의 길이 12 cm가 평행선 사이의 거리입니다."},{id:"B6-5",src:"기본6 · 5번",lv:1,img:"B6_A",t:"mc",q:"직사각형 모양 종이띠를 선을 따라 잘랐습니다. 평행한 변이 있는 사각형은 모두 몇 개인가요?",o:["2개","3개","4개","5개","6개"],a:4,exp:"직사각형은 위와 아래 변이 평행하므로 잘라서 생긴 모든 사각형에 평행한 변이 있습니다. 6개"},{id:"B6-6",src:"기본6 · 6번",lv:2,img:"B6_A",t:"mc",q:"잘라 낸 도형 중 평행사변형을 바르게 짝지은 것은?",o:["가, 나","나, 라","다, 마","다, 바","마, 바"],a:2,exp:"마주 보는 두 쌍의 변이 서로 평행한 사각형은 다, 마입니다."},{id:"B6-7",src:"기본6 · 7번",lv:2,img:"B6_6",t:"num",q:"슬기는 철사 30 cm를 남김없이 사용하여 평행사변형을 만들었습니다. □ 안에 알맞은 수는?",unit:"cm",a:7,exp:"□ + 8 + □ + 8 = 30, □ + □ = 14, □ = 7"},{id:"B6-8",src:"기본6 · 8번",lv:2,img:"B6_7",t:"mc",q:"크기가 같은 정삼각형 2개를 이어 붙이면 마름모가 됩니다. 그 이유는?",o:["네 변의 길이가 모두 같기 때문","네 각이 모두 직각이기 때문","평행한 변이 한 쌍뿐이기 때문","삼각형 두 개로 만들었기 때문"],a:0,exp:"정삼각형을 이어 붙여 만든 사각형은 네 변의 길이가 모두 같으므로 마름모입니다."},{id:"B6-9",src:"기본6 · 9번",lv:3,img:"B6_8",t:"num",q:"사각형 ㄱㄴㄷㄹ은 마름모입니다. 각 ㄱㄴㄷ의 크기는 몇 도인가요?",unit:"°",a:40,exp:"삼각형 ㄱㄷㄹ은 이등변삼각형이므로 (각 ㄹㄱㄷ) = 70°. (각 ㄱㄹㄷ) = 180° − 70° − 70° = 40°. 마주 보는 각은 같으므로 각 ㄱㄴㄷ = 40°"},{id:"B6-10",src:"기본6 · 10번",lv:1,img:"B6_9",t:"nums",q:"정사각형을 보고 □ 안에 알맞은 수를 써넣으세요.",labels:["안쪽 각 □°","오른쪽 위 변 □ cm"],a:[90,11],exp:"정사각형은 네 각이 모두 90°이고 네 변의 길이가 모두 같습니다(11 cm)."}];
